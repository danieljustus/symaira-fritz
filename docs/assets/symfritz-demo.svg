<svg xmlns="http://www.w3.org/2000/svg" width="854" height="1187" viewBox="0 0 854 1187" role="img" aria-label="symfritz terminal demo: output of symfritz version, symfritz --help, and symfritz status --help">
<defs><style>text{font-family:Menlo, Monaco, 'Courier New', monospace;font-size:14px;}</style></defs>
<rect width="854" height="1187" rx="12" fill="#141413" stroke="#30302E"/>
<rect width="854" height="40" rx="12" fill="#1C1C1B"/>
<rect y="28" width="854" height="12" fill="#1C1C1B"/>
<circle cx="34" cy="20.0" r="6.5" fill="#97958F" fill-opacity=".5"/>
<circle cx="56" cy="20.0" r="6.5" fill="#97958F" fill-opacity=".5"/>
<circle cx="78" cy="20.0" r="6.5" fill="#97958F" fill-opacity=".5"/>
<text x="427.0" y="25.0" text-anchor="middle" fill="#97958F" font-size="13">symfritz — zsh — 88×24</text>
<text x="20" y="67" fill="#97958F">$</text>
<text x="34" y="67" fill="#E0D2BA">./symfritz version</text>
<text x="20" y="86" fill="#EEEDEA">symfritz dev</text>
<text x="20" y="124" fill="#97958F">$</text>
<text x="34" y="124" fill="#E0D2BA">./symfritz --help</text>
<text x="20" y="143" fill="#EEEDEA">symfritz talks to a FRITZ!Box over its documented interfaces:</text>
<text x="20" y="162" fill="#EEEDEA"></text>
<text x="20" y="181" fill="#EEEDEA">  TR-064  (SOAP)  administration: status, WAN/IP, WLAN, hosts, mesh, reboot</text>
<text x="20" y="200" fill="#EEEDEA">  AHA-HTTP        DECT smart-home actors (switches, thermostats)</text>
<text x="20" y="219" fill="#EEEDEA">  Session login   for AHA and (later) web-UI data scraping</text>
<text x="20" y="238" fill="#EEEDEA"></text>
<text x="20" y="257" fill="#EEEDEA">Configure the box once with &#x27;symfritz config init&#x27;, then set the password via</text>
<text x="20" y="276" fill="#EEEDEA">the SYMFRITZ_PASSWORD environment variable.</text>
<text x="20" y="295" fill="#EEEDEA"></text>
<text x="20" y="314" fill="#EEEDEA">Usage:</text>
<text x="20" y="333" fill="#EEEDEA">  symfritz [command]</text>
<text x="20" y="352" fill="#EEEDEA"></text>
<text x="20" y="371" fill="#EEEDEA">Available Commands:</text>
<text x="20" y="390" fill="#EEEDEA">  auth        Manage FRITZ!Box credentials (test, login, store)</text>
<text x="20" y="409" fill="#EEEDEA">  call        Invoke a raw TR-064 action (power user)</text>
<text x="20" y="428" fill="#EEEDEA">  calls       Show FRITZ!Box call list</text>
<text x="20" y="447" fill="#EEEDEA">  completion  Generate the autocompletion script for the specified shell</text>
<text x="20" y="466" fill="#EEEDEA">  config      Manage symfritz configuration</text>
<text x="20" y="485" fill="#EEEDEA">  detect      Detect the local FRITZ!Box on the network</text>
<text x="20" y="504" fill="#EEEDEA">  diagnose    End-to-end reachability check for a host (name, MAC, or IP)</text>
<text x="20" y="523" fill="#EEEDEA">  dial        Instruct the FRITZ!Box to dial a phone number</text>
<text x="20" y="542" fill="#EEEDEA">  dsl         Show DSL line statistics (noise margin, attenuation, max bit rate)</text>
<text x="20" y="561" fill="#EEEDEA">  hangup      Hang up any active call initiated by dial</text>
<text x="20" y="580" fill="#EEEDEA">  help        Help about any command</text>
<text x="20" y="599" fill="#EEEDEA">  home        DECT smart-home actors (switches, thermostats)</text>
<text x="20" y="618" fill="#EEEDEA">  hosts       FRITZ!Box host table (LAN/WLAN devices)</text>
<text x="20" y="637" fill="#EEEDEA">  log         Show FRITZ!Box system event log</text>
<text x="20" y="656" fill="#EEEDEA">  mcp         Start the MCP stdio server</text>
<text x="20" y="675" fill="#EEEDEA">  mesh        Show the mesh topology (nodes, repeaters, links)</text>
<text x="20" y="694" fill="#EEEDEA">  reboot      Reboot the FRITZ!Box</text>
<text x="20" y="713" fill="#EEEDEA">  scrape      Fetch a data.lua page (best-effort, fragile)</text>
<text x="20" y="732" fill="#EEEDEA">  services    Discover TR-064 services advertised by the box (tr64desc.xml)</text>
<text x="20" y="751" fill="#EEEDEA">  status      Show a box overview (model, firmware, connection, external IP, CPU temperature)</text>
<text x="20" y="770" fill="#EEEDEA">  traffic     Show current WAN traffic rates (--watch for live updates)</text>
<text x="20" y="789" fill="#EEEDEA">  version     Print version</text>
<text x="20" y="808" fill="#EEEDEA">  wlan        WLAN radios, clients, and guest network</text>
<text x="20" y="827" fill="#EEEDEA">  wol         Send a Wake-on-LAN packet via the FRITZ!Box</text>
<text x="20" y="846" fill="#EEEDEA">  doctor      Check configuration, credentials, and box connectivity</text>
<text x="20" y="865" fill="#EEEDEA">Flags:</text>
<text x="20" y="884" fill="#EEEDEA">  -h, --help      help for symfritz</text>
<text x="20" y="903" fill="#EEEDEA">  -v, --version   version for symfritz</text>
<text x="20" y="922" fill="#EEEDEA"></text>
<text x="20" y="941" fill="#EEEDEA">Use &quot;symfritz [command] --help&quot; for more information about a command.</text>
<text x="20" y="979" fill="#97958F">$</text>
<text x="34" y="979" fill="#E0D2BA">./symfritz status --help</text>
<text x="20" y="998" fill="#EEEDEA">Show a box overview (model, firmware, connection, external IP, CPU temperature)</text>
<text x="20" y="1017" fill="#EEEDEA"></text>
<text x="20" y="1036" fill="#EEEDEA">Usage:</text>
<text x="20" y="1055" fill="#EEEDEA">  symfritz status [flags]</text>
<text x="20" y="1074" fill="#EEEDEA"></text>
<text x="20" y="1093" fill="#EEEDEA">Flags:</text>
<text x="20" y="1112" fill="#EEEDEA">      --cpu    Show CPU temperatures (experimental)</text>
<text x="20" y="1131" fill="#EEEDEA">  -h, --help   help for status</text>
<text x="20" y="1150" fill="#EEEDEA">      --json   Output as JSON</text>
</svg>
