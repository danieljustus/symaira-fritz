[workspace]
members = ["crates/symfritz-cli", "crates/symfritz-core", "crates/symfritz-tr064"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-fritz"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
quick-xml = "0.42.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symfritz-core = { path = "crates/symfritz-core", version = "=0.0.0" }
