[workspace]
members = ["crates/symfritz-aha", "crates/symfritz-cli", "crates/symfritz-core", "crates/symfritz-tr064"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-fritz"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
hex = "0.4.3"
getrandom = "0.2.17"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rcgen = "0.14.10"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
roxmltree = "0.21.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symfritz-core = { path = "crates/symfritz-core", version = "=0.0.0" }
toml = "1.1.5"
url = "2.5.8"
x509-parser = "0.18.1"
