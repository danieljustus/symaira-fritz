name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "latest"
          install-go: false

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        run: |
          # version is a var in package main → inject into main.version.
          VERSION_PKG="main"
          if [ -n "$GITHUB_REF_NAME" ] && git describe --tags --exact-match >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match)"
          elif [ -n "$GITHUB_SHA" ]; then
            SHORT_SHA="${GITHUB_SHA:0:7}"
            VERSION="0.0.0-dev+${SHORT_SHA}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Injecting version: ${VERSION}"
          CGO_ENABLED=0 go build -ldflags "-s -w -X ${VERSION_PKG}.version=${VERSION}" -o /dev/null ./cmd/symfritz
          CGO_ENABLED=0 go build ./...

      - name: Test
        run: CGO_ENABLED=0 go test -cover ./...

      - name: Check docs up to date
        run: |
          make docs
          if [ -n "$(git status --porcelain docs/cli.md)" ]; then
            echo "docs/cli.md is out of date. Run 'make docs' and commit the changes."
            git diff docs/cli.md
            exit 1
          fi

