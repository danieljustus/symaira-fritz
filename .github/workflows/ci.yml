name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-and-test-cargo-rust-1.98.0-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-and-test-cargo-rust-1.98.0-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-build-and-test-cargo-rust-1.98.0-

      - name: Validate release contracts
        run: |
          python3 scripts/test_release_workflow.py
          python3 scripts/test_release_manifest.py
          python3 scripts/test_brand_assets.py

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: CLI black-box contract guardrails
        shell: bash
        run: |
          cargo build -p symfritz-cli --bin symfritz --locked
          python3 scripts/test_cli_differential.py

      - name: CLI black-box contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --workspace --locked
          python3 scripts/run-cli-differential.py --root . --rust ./target/debug/symfritz

      - name: CLI black-box contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --workspace --locked
          python scripts/run-cli-differential.py --root . --rust .\target\debug\symfritz.exe

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Dependency policy
        run: cargo deny check

  cross-platform:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cross-platform-cargo-rust-1.98.0-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cross-platform-cargo-rust-1.98.0-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-cross-platform-cargo-rust-1.98.0-

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: CLI black-box contract guardrails
        shell: bash
        run: |
          cargo build -p symfritz-cli --bin symfritz --locked
          python3 scripts/test_cli_differential.py

      - name: CLI black-box contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --workspace --locked
          python3 scripts/run-cli-differential.py --root . --rust ./target/debug/symfritz

      - name: CLI black-box contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --workspace --locked
          python scripts/run-cli-differential.py --root . --rust .\target\debug\symfritz.exe
