name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "latest"
          install-go: false

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Build
        run: |
          # version is a var in package main → inject into main.version.
          VERSION_PKG="main"
          if [ -n "$GITHUB_REF_NAME" ] && git describe --tags --exact-match >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match)"
          elif [ -n "$GITHUB_SHA" ]; then
            SHORT_SHA="${GITHUB_SHA:0:7}"
            VERSION="0.0.0-dev+${SHORT_SHA}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Injecting version: ${VERSION}"
          CGO_ENABLED=0 go build -ldflags "-s -w -X ${VERSION_PKG}.version=${VERSION}" -o /dev/null ./cmd/symfritz
          CGO_ENABLED=0 go build ./...

      - name: Test
        run: CGO_ENABLED=0 go test -cover ./...

      - name: Check docs up to date
        run: |
          make docs
          if [ -n "$(git status --porcelain docs/cli.md)" ]; then
            echo "docs/cli.md is out of date. Run 'make docs' and commit the changes."
            git diff docs/cli.md
            exit 1
          fi

  rust-port:
    name: Rust port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go oracle
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Dependency policy
        if: runner.os == 'Linux'
        run: cargo deny check

      - name: Version differential parity
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=dev" \
            -o "target/debug/symfritz-go${suffix}" ./cmd/symfritz
          cargo build --workspace --locked
          if command -v python3 >/dev/null 2>&1; then
            python_cmd=python3
          else
            python_cmd=python
          fi
          "$python_cmd" scripts/port-parity.py \
            --reference "./target/debug/symfritz-go${suffix}" \
            --candidate "./target/debug/symfritz-rust${suffix}"

