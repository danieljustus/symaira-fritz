name: Verify Homebrew formula

# Reads back the published symfritz formula from the tap's main branch and
# installs it. The release workflow calls this once the tap pull request has
# merged; run it manually for a release whose tap pull request merged later.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v1.2.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify published Homebrew formula
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read back and install formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $tag_re ]]; then
            echo "Homebrew verification only covers stable vMAJOR.MINOR.PATCH tags: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          release_url="https://github.com/danieljustus/symaira-fritz/releases/download/$TAG"
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          gh release download "$TAG" --repo danieljustus/symaira-fritz \
            --pattern checksums.txt --dir "$release_dir"
          checksums="$release_dir/checksums.txt"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --quiet --depth 1 https://github.com/danieljustus/homebrew-tap.git "$tap"
          remote_formula="$tap/Formula/symfritz.rb"
          expected_formula="$RUNNER_TEMP/expected-symfritz.rb"
          python3 scripts/render_homebrew_formula.py \
            --version "$version" \
            --release-url "$release_url" \
            --checksums "$checksums" \
            --output "$expected_formula"
          python3 scripts/verify_homebrew_formula.py \
            --formula "$remote_formula" \
            --version "$version" \
            --release-url "$release_url" \
            --checksums "$checksums"
          cmp -- "$expected_formula" "$remote_formula"
          brew uninstall --force symfritz >/dev/null 2>&1 || true
          brew tap danieljustus/tap https://github.com/danieljustus/homebrew-tap
          brew update
          brew install danieljustus/tap/symfritz
          test "$(symfritz version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$version"
