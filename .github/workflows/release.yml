name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the leading v
        required: true
        type: string
      channel:
        description: Release channel (stable updates Homebrew; prerelease does not)
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-15
            rust_target: x86_64-apple-darwin
            runtime_validation: true
          - os: darwin
            arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            runtime_validation: true
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            runtime_validation: true
          - os: linux
            arch: arm64
            runner: ubuntu-24.04
            rust_target: aarch64-unknown-linux-gnu
            runtime_validation: false
          - os: windows
            arch: amd64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            runtime_validation: true
          - os: windows
            arch: arm64
            runner: windows-2025
            rust_target: aarch64-pc-windows-msvc
            runtime_validation: false
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            version="${REF_NAME#v}"
            if [[ "$version" == *-* ]]; then channel=prerelease; else channel=stable; fi
          else
            version="$INPUT_VERSION"
            channel="$INPUT_CHANNEL"
          fi
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "Invalid strict SemVer release version: $version" >&2
            exit 1
          fi
          if [[ "$channel" != stable && "$channel" != prerelease ]]; then
            echo "Invalid release channel: $channel" >&2
            exit 1
          fi
          if [[ "$version" == *-* && "$channel" != prerelease ]] \
            || [[ "$version" != *-* && "$channel" != stable ]]; then
            echo "Release channel does not match SemVer prerelease state: $version ($channel)" >&2
            exit 1
          fi
          ref_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$ref_sha" = "$GITHUB_SHA"
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'tag=v%s\n' "$version"
            printf 'sha=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup target add --toolchain 1.98.0 "${{ matrix.rust_target }}"

      - name: Install Linux arm64 cross compiler
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure Linux arm64 Rust linker and C compiler
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' \
            'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' \
            'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++' \
            'AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar' >> "$GITHUB_ENV"

      - name: Import macOS signing material
        if: matrix.os == 'darwin'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for required in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required secret is not set. Refusing an unsigned or unnotarized release."
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          INTERMEDIATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$INTERMEDIATE_PATH"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $INTERMEDIATE_PATH" | shasum -a 256 -c -
          security import "$INTERMEDIATE_PATH" -A -t cert -f x509 -k "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("${keychain//\"/}")
          done < <(security list-keychain -d user)
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          test -n "$IDENTITY"
          printf 'CODESIGN_IDENTITY=%s\n' "$IDENTITY" >> "$GITHUB_ENV"
          printf 'KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build release binaries
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          mkdir -p dist/.build
          suffix=''
          if [ "$TARGET_OS" = windows ]; then suffix='.exe'; fi
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/.build/symfritz-go${suffix}" ./cmd/symfritz
          SYMFRITZ_VERSION="$VERSION" cargo build --release --locked --target "$RUST_TARGET" -p symfritz-cli
          cp "target/$RUST_TARGET/release/symfritz${suffix}" "dist/.build/symfritz${suffix}"

      - name: Sign and notarize macOS binaries
        if: matrix.os == 'darwin'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/sign-and-notarize.sh darwin "dist/.build/symfritz"
          ./scripts/sign-and-notarize.sh darwin "dist/.build/symfritz-go"

      - name: Package and validate archive
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ matrix.os }}/${{ matrix.arch }}
          RUNTIME_VALIDATION: ${{ matrix.runtime_validation }}
        run: |
          set -euo pipefail
          suffix=''
          case "$TARGET" in windows/*) suffix='.exe';; esac
          validation_args=()
          if [ "$RUNTIME_VALIDATION" != true ]; then
            validation_args+=(--skip-runtime-validation)
          fi
          python3 scripts/release_snapshot.py \
            --version "$VERSION" \
            --out dist \
            --target "$TARGET" \
            --skip-build \
            "${validation_args[@]}" \
            --rust-bin "$(pwd)/dist/.build/symfritz${suffix}" \
            --go-bin "$(pwd)/dist/.build/symfritz-go${suffix}"
          rm -rf dist/.build

      - name: Upload target tar archive
        if: matrix.os != 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/symaira-fritz_*.tar.gz
          if-no-files-found: error

      - name: Upload Windows target zip archive
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}-zip
          path: dist/symaira-fritz_*.zip
          if-no-files-found: error

      - name: Clean up signing material
        if: always() && matrix.os == 'darwin'
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  publish:
    name: Publish release and distribution metadata
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            version="${REF_NAME#v}"
            if [[ "$version" == *-* ]]; then channel=prerelease; else channel=stable; fi
          else
            version="$INPUT_VERSION"
            channel="$INPUT_CHANNEL"
          fi
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "Invalid strict SemVer release version: $version" >&2
            exit 1
          fi
          if [[ "$channel" != stable && "$channel" != prerelease ]]; then
            echo "Invalid release channel: $channel" >&2
            exit 1
          fi
          if [[ "$version" == *-* && "$channel" != prerelease ]] \
            || [[ "$version" != *-* && "$channel" != stable ]]; then
            echo "Release channel does not match SemVer prerelease state: $version ($channel)" >&2
            exit 1
          fi
          ref_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$ref_sha" = "$GITHUB_SHA"
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'tag=v%s\n' "$version"
            printf 'sha=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Download target archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate complete release matrix
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py --version "$VERSION" --dist dist --output dist/release-manifest.json

      - name: Install pinned Syft from verified archive
        shell: bash
        run: |
          set -euo pipefail
          syft_version=1.51.1
          syft_archive="syft_${syft_version}_linux_amd64.tar.gz"
          syft_base="https://github.com/anchore/syft/releases/download/v${syft_version}"
          syft_dir="$RUNNER_TEMP/syft"
          mkdir -p "$syft_dir"
          curl -fsSLo "$RUNNER_TEMP/$syft_archive" "$syft_base/$syft_archive"
          curl -fsSLo "$RUNNER_TEMP/syft_checksums.txt" "$syft_base/syft_${syft_version}_checksums.txt"
          expected="$(awk -v archive="$syft_archive" '$2 == archive { print $1 }' "$RUNNER_TEMP/syft_checksums.txt")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$syft_archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$syft_archive" -C "$syft_dir" syft
          test -x "$syft_dir/syft"
          "$syft_dir/syft" version
          printf '%s\n' "$syft_dir" >> "$GITHUB_PATH"

      - name: Generate SBOMs and checksums
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for archive in dist/symaira-fritz_*.tar.gz dist/symaira-fritz_*.zip; do
            [ -f "$archive" ] || continue
            syft "file:$archive" -o "cyclonedx-json=$archive.sbom.cdx.json"
          done
          python3 scripts/release_manifest.py --version "$VERSION" --dist dist --checksums --output dist/checksums.txt
          test -s dist/checksums.txt

      - name: Publish GitHub release (single publisher)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          assets=(dist/*)
          tag_target="$(git ls-remote origin "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$tag_target" ]; then
            tag_target="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$tag_target" ] && [ "$tag_target" != "$GITHUB_SHA" ]; then
            echo "Refusing release tag $TAG: remote target $tag_target differs from $GITHUB_SHA" >&2
            exit 1
          fi
          release_json=''
          if release_json="$(gh release view "$TAG" --json tagName,isPrerelease,targetCommitish 2>/dev/null)"; then
            test -n "$tag_target"
            release_is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
            expected_is_prerelease=false
            [ "$CHANNEL" = prerelease ] && expected_is_prerelease=true
            if [ "$release_is_prerelease" != "$expected_is_prerelease" ]; then
              echo "Refusing to clobber $TAG across release channels" >&2
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            create_args=(gh release create "$TAG" "${assets[@]}" --generate-notes)
            if [ "$EVENT_NAME" = push ]; then
              create_args+=(--verify-tag)
            else
              create_args+=(--target "$GITHUB_SHA")
            fi
            [ "$CHANNEL" = prerelease ] && create_args+=(--prerelease)
            "${create_args[@]}"
          fi

      - name: Read back exact public release
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          expected_assets="$RUNNER_TEMP/expected-assets.txt"
          actual_assets="$RUNNER_TEMP/actual-assets.txt"
          tag_target_file="$RUNNER_TEMP/tag-target.txt"
          gh release view "$TAG" --json assets,isPrerelease,tagName,targetCommitish > "$release_json"
          git ls-remote origin "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }' > "$tag_target_file"
          if [ ! -s "$tag_target_file" ]; then
            git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }' > "$tag_target_file"
          fi
          test "$(tr -d '\n' < "$tag_target_file")" = "$GITHUB_SHA"
          python3 - "$VERSION" "$CHANNEL" "$release_json" "$expected_assets" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from release_manifest import TARGETS, archive_name

          version, channel, release_path, expected_path = sys.argv[1:]
          release = json.loads(Path(release_path).read_text(encoding="utf-8"))
          if release["tagName"] != f"v{version}":
              raise SystemExit("release tag name does not match the requested version")
          if bool(release["isPrerelease"]) != (channel == "prerelease"):
              raise SystemExit("release channel does not match the requested channel")
          archives = [archive_name(version, os_name, arch) for os_name, arch in TARGETS]
          expected = archives + [f"{name}.sbom.cdx.json" for name in archives]
          expected += ["checksums.txt", "release-manifest.json"]
          Path(expected_path).write_text("".join(f"{name}\n" for name in sorted(expected)), encoding="utf-8")
          actual = sorted(asset["name"] for asset in release["assets"])
          if actual != sorted(expected):
              raise SystemExit(f"release assets differ: {actual!r} != {sorted(expected)!r}")
          PY
          jq -r '.assets[].name' "$release_json" | sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"
          readback="$RUNNER_TEMP/release-readback"
          rm -rf "$readback"
          mkdir -p "$readback"
          gh release download "$TAG" --dir "$readback" --clobber
          (cd "$readback" && sha256sum -c checksums.txt)
          for archive in "$readback"/symaira-fritz_*.tar.gz "$readback"/symaira-fritz_*.zip; do
            [ -s "$archive.sbom.cdx.json" ]
          done
          test -s "$readback/release-manifest.json"

      - name: Update and verify Homebrew formula for stable channel
        if: steps.release.outputs.channel == 'stable'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_GITHUB_TOKEN"
          tap="$RUNNER_TEMP/homebrew-tap"
          release_url="https://github.com/danieljustus/symaira-fritz/releases/download/v$VERSION"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/danieljustus/homebrew-tap.git" "$tap"
          formula="$tap/Formula/symfritz.rb"
          python3 scripts/render_homebrew_formula.py \
            --version "$VERSION" \
            --release-url "$release_url" \
            --checksums dist/checksums.txt \
            --output "$formula"
          python3 scripts/verify_homebrew_formula.py \
            --formula "$formula" \
            --version "$VERSION" \
            --release-url "$release_url" \
            --checksums dist/checksums.txt
          ruby -c "$formula"
          for asset in \
            "symaira-fritz_${VERSION}_darwin_amd64.tar.gz" \
            "symaira-fritz_${VERSION}_darwin_arm64.tar.gz" \
            "symaira-fritz_${VERSION}_linux_amd64.tar.gz" \
            "symaira-fritz_${VERSION}_linux_arm64.tar.gz"; do
            curl -fsSIL "$release_url/$asset" >/dev/null
          done
          if command -v brew >/dev/null 2>&1; then
            brew style "$formula"
          fi
          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::Homebrew is required for stable release verification" >&2
            exit 1
          fi
          git -C "$tap" config user.name github-actions[bot]
          git -C "$tap" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$tap" add Formula/symfritz.rb
          if ! git -C "$tap" diff --cached --quiet; then
            git -C "$tap" commit -m "symfritz $VERSION: ship Rust primary and Go fallback"
            git -C "$tap" push origin HEAD:main
          fi
          git -C "$tap" fetch --quiet origin main
          remote_formula="$RUNNER_TEMP/remote-symfritz.rb"
          git -C "$tap" show origin/main:Formula/symfritz.rb > "$remote_formula"
          cmp -- "$formula" "$remote_formula"
          brew uninstall --force symfritz >/dev/null 2>&1 || true
          brew install --formula "$formula"
          symfritz version
          symfritz-go version
