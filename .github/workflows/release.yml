name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the leading v
        required: true
        type: string
      channel:
        description: Release channel (stable updates Homebrew; prerelease does not)
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-15
            rust_target: x86_64-apple-darwin
          - os: darwin
            arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04
            rust_target: aarch64-unknown-linux-gnu
          - os: windows
            arch: amd64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-2025
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            version="${REF_NAME#v}"
            channel=stable
          else
            version="$INPUT_VERSION"
            channel="$INPUT_CHANNEL"
          fi
          case "$version" in
            ''|*[!0-9A-Za-z.-]*) echo 'Invalid release version' >&2; exit 1;;
          esac
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'tag=v%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup target add --toolchain 1.98.0 "${{ matrix.rust_target }}"

      - name: Import macOS signing material
        if: matrix.os == 'darwin'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for required in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required secret is not set. Refusing an unsigned or unnotarized release."
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          INTERMEDIATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$INTERMEDIATE_PATH"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $INTERMEDIATE_PATH" | shasum -a 256 -c -
          security import "$INTERMEDIATE_PATH" -A -t cert -f x509 -k "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("${keychain//\"/}")
          done < <(security list-keychain -d user)
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          test -n "$IDENTITY"
          printf 'CODESIGN_IDENTITY=%s\n' "$IDENTITY" >> "$GITHUB_ENV"
          printf 'KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build release binaries
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          mkdir -p dist/.build
          suffix=''
          if [ "$TARGET_OS" = windows ]; then suffix='.exe'; fi
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/.build/symfritz-go${suffix}" ./cmd/symfritz
          SYMFRITZ_VERSION="$VERSION" cargo build --release --locked --target "$RUST_TARGET" -p symfritz-cli
          cp "target/$RUST_TARGET/release/symfritz${suffix}" "dist/.build/symfritz${suffix}"

      - name: Sign and notarize macOS binaries
        if: matrix.os == 'darwin'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/sign-and-notarize.sh darwin "dist/.build/symfritz"
          ./scripts/sign-and-notarize.sh darwin "dist/.build/symfritz-go"

      - name: Package and validate archive
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          set -euo pipefail
          suffix=''
          case "$TARGET" in windows/*) suffix='.exe';; esac
          python3 scripts/release_snapshot.py \
            --version "$VERSION" \
            --out dist \
            --target "$TARGET" \
            --skip-build \
            --rust-bin "$(pwd)/dist/.build/symfritz${suffix}" \
            --go-bin "$(pwd)/dist/.build/symfritz-go${suffix}"
          rm -rf dist/.build

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/symaira-fritz_*.tar.gz
          if-no-files-found: ignore

      - name: Upload Windows target archive
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}-zip
          path: dist/symaira-fritz_*.zip
          if-no-files-found: error

      - name: Clean up signing material
        if: always() && matrix.os == 'darwin'
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  publish:
    name: Publish release and distribution metadata
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then version="${REF_NAME#v}"; channel=stable; else version="$INPUT_VERSION"; channel="$INPUT_CHANNEL"; fi
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'tag=v%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Download target archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate complete release matrix
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py --version "$VERSION" --dist dist --output dist/release-manifest.json

      - name: Install pinned Syft
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syft"
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/v1.51.1/install.sh | sh -s -- -b "$RUNNER_TEMP/syft"
          "$RUNNER_TEMP/syft/syft" version
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"

      - name: Generate SBOMs and checksums
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for archive in dist/symaira-fritz_*.tar.gz dist/symaira-fritz_*.zip; do
            [ -f "$archive" ] || continue
            syft "file:$archive" -o "cyclonedx-json=$archive.sbom.cdx.json"
          done
          python3 scripts/release_manifest.py --version "$VERSION" --dist dist --checksums --output dist/checksums.txt
          test -s dist/checksums.txt

      - name: Publish GitHub release (single publisher)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          prerelease=''
          if [ "$CHANNEL" = prerelease ]; then prerelease='--prerelease'; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ "$EVENT_NAME" = push ]; then
            gh release create "$TAG" dist/* --verify-tag --generate-notes $prerelease
          else
            gh release create "$TAG" dist/* --generate-notes $prerelease
          fi

      - name: Update Homebrew formula for stable channel
        if: steps.release.outputs.channel == 'stable'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_GITHUB_TOKEN"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/danieljustus/homebrew-tap.git" "$tap"
          python3 scripts/render_homebrew_formula.py \
            --version "$VERSION" \
            --release-url "https://github.com/danieljustus/symaira-fritz/releases/download/v$VERSION" \
            --checksums dist/checksums.txt \
            --output "$tap/Formula/symfritz.rb"
          ruby -c "$tap/Formula/symfritz.rb"
          git -C "$tap" config user.name github-actions[bot]
          git -C "$tap" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$tap" add Formula/symfritz.rb
          if ! git -C "$tap" diff --cached --quiet; then
            git -C "$tap" commit -m "symfritz $VERSION: ship Rust primary and Go fallback"
            git -C "$tap" push origin HEAD:main
          fi
